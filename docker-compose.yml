services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      otel-collector: { condition: service_started }
    ports: ["8000:8000"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./secrets:/run/secrets:ro

  outbox-relay:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: ec-outbox-relay
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      otel-collector: { condition: service_started }
    command: ["python", "-m", "app.workers.outbox_relay"]
    volumes: ["./secrets:/run/secrets:ro"]

  order-event-consumer:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: ec-order-consumer
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      otel-collector: { condition: service_started }
    command: ["python", "-m", "app.workers.order_consumer"]
    volumes: ["./secrets:/run/secrets:ro"]

  checkout-sweeper:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    environment:
      OTEL_SERVICE_NAME: ec-checkout-sweeper
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    command: ["python", "-m", "app.workers.checkout_sweeper"]
    volumes: ["./secrets:/run/secrets:ro"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ec
      POSTGRES_PASSWORD: ec
      POSTGRES_DB: ec
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ec"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    ports: ["4317:4317", "4318:4318"]

volumes:
  pgdata: {}
