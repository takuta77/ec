name: _security-reusable

on:
  workflow_call:
    inputs:
      secrets-full-history:
        description: "If true, gitleaks scans full git history (used by nightly). If false, scan diff only."
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write   # required for SARIF upload

jobs:
  deps:
    name: deps (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Export requirements from uv.lock
        run: uv export --no-hashes --no-dev > /tmp/requirements.txt
      - name: Build pip-audit args (apply allowlist + reject expired)
        id: audit-args
        # $today and $vuln_id in yq expressions are yq named variables, not shell variables.
        # SC2016 ("expressions don't expand in single quotes") is a false positive here.
        shell: bash
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          # shellcheck disable=SC2016
          EXPIRED=$(yq -r --arg today "$TODAY" \
            '.ignores[] | select(.expires_at <= $today) | "\(.vuln_id) (expired \(.expires_at))"' \
            .security/pip-audit-ignore.yaml || true)
          if [ -n "$EXPIRED" ]; then
            echo "::error::Expired entries in .security/pip-audit-ignore.yaml:"
            echo "$EXPIRED"
            exit 1
          fi
          IGNORE_ARGS=""
          while IFS= read -r vid; do
            [ -n "$vid" ] && IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $vid"
          done < <(yq -r '.ignores[].vuln_id // empty' .security/pip-audit-ignore.yaml)
          echo "args=$IGNORE_ARGS" >> "$GITHUB_OUTPUT"
      - name: Run pip-audit
        run: |
          uv run pip-audit \
            --requirement /tmp/requirements.txt \
            --strict \
            --format sarif \
            --output pip-audit.sarif \
            ${{ steps.audit-args.outputs.args }}
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep CI
        run: |
          semgrep ci \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/jwt \
            --sarif --output semgrep.sarif \
            --error
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.secrets-full-history && '0' || '1' }}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: gitleaks

  image:
    name: image (trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t ec-api:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ec-api:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # warn-only for now
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy

  dockerfile:
    name: dockerfile (hadolint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true   # warn-only
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  iac:
    name: iac (checkov)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          file: docker-compose.yml
          output_format: sarif
          output_file_path: ./checkov.sarif
          soft_fail: true   # warn-only
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif/results_sarif.sarif
          category: checkov
