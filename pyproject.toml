[project]
name = "ec-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aio-pika>=9.6.2",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3",
    "structlog>=25.5.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.42",
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-otlp>=1.42",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b0",
    "opentelemetry-instrumentation-asyncpg>=0.63b0",
    "opentelemetry-instrumentation-aio-pika>=0.63b0",
    "opentelemetry-instrumentation-httpx>=0.63b0",
    "opentelemetry-instrumentation-logging>=0.63b0",
    "bcrypt<5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,rabbitmq]>=4.14.2",
    "ruff>=0.8",
    "mypy>=1.13",
    # capped <4.26 because semgrep 1.163.0 pins jsonschema<4.26.dev0.
    # Bump to >=4.26 once semgrep widens its constraint.
    "jsonschema>=4.25,<4.26",
    "pip-audit>=2.7",
    "semgrep>=1.95",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: requires Testcontainers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
# semgrep (dev) pins 5 OTel packages to ~=1.37.0 / ~=0.58b0, which conflicts
# with our runtime requirement (>=1.42 / >=0.63b0). semgrep uses OTel only for
# its own telemetry; forcing the newer packages is safe — the OTel public API
# is backwards-compatible within the 1.x stable and 0.x contrib trains.
#
# starlette: PYSEC-2026-161 (host header validation bypass) — fixed in 1.0.1.
# FastAPI 0.136.x permits both 1.0.0 and 1.0.1; force the fix.
override-dependencies = [
    "opentelemetry-api>=1.42",
    "opentelemetry-sdk>=1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.42",
    "opentelemetry-instrumentation-requests>=0.63b0",
    "opentelemetry-instrumentation-threading>=0.63b0",
    "starlette>=1.0.1",
]
