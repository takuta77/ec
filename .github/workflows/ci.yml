name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  type:
    name: type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: mypy strict
        run: uv run mypy app

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (unit)
        run: uv run pytest -m "not slow" --cov=app --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  test-slow:
    name: test-slow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (slow / Testcontainers)
        run: uv run pytest -m slow --maxfail=3 --cov=app --cov-report=xml:coverage-slow.xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml-slow
          path: coverage-slow.xml
          retention-days: 14

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    continue-on-error: true  # warn-only initially (promote to required in C-1b)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4  # v2.0.1
        with:
          tofu_version: "1.12.0"
      - name: fmt
        run: tofu -chdir=infra/terraform fmt -check -recursive
      - name: init + validate
        run: |
          tofu -chdir=infra/terraform init -backend=false
          tofu -chdir=infra/terraform validate
      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93  # v6.2.2
        with:
          tflint_version: latest
      - name: tflint
        run: |
          cd infra/terraform
          tflint --init
          tflint
      - name: ecspresso json syntax
        run: find infra/ecspresso -name '*.json' -exec jq empty {} \;
